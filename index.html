<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner d'Inventaire Pro</title>
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --light-gray: #f8fafc;
            --border-color: #e2e8f0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 15px; 
            background: var(--light-gray); 
            color: var(--dark);
        }
        .container { max-width: 600px; margin: auto; }
        h2 { text-align: center; color: var(--dark); margin-bottom: 20px; }
        #reader { 
            width: 100%; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border-color) !important; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            background: black;
        }
        #lock-timer {
            width: 100%; height: 8px; background: var(--border-color);
            margin-top: 10px; border-radius: 4px; overflow: hidden; display: none;
        }
        #lock-bar { 
            height: 100%; background: var(--success); width: 0%; transition: width 0.1s linear; 
        }
        #last-scan {
            font-weight: bold; color: var(--success); margin: 10px 0; 
            min-height: 1.2em; text-align: center; word-wrap: break-word;
        }
        .controls { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; 
        }
        button {
            padding: 12px; border: none; border-radius: 8px; color: white;
            font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:active { opacity: 0.7; }
        .btn-excel { background-color: #166534; }
        .btn-reset { background-color: var(--danger); }
        .btn-edit, .btn-delete {
            font-size: 12px; padding: 6px 10px; margin-left: 5px; min-width: 80px;
        }
        .btn-edit { background-color: var(--primary); }
        .btn-delete { background-color: var(--warning); }
        .stats {
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); margin-top: 10px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { 
            text-align: left; font-size: 12px; text-transform: uppercase; 
            color: #64748b; padding-bottom: 8px; 
        }
        td { 
            padding: 12px 0; border-top: 1px solid #f1f5f9; font-family: monospace;
            vertical-align: middle; word-break: break-all;
        }
        .qty-badge {
            background: #dcfce7; color: #166534; padding: 4px 10px;
            border-radius: 999px; font-weight: bold; font-family: sans-serif;
        }
        .actions-cell { text-align: right; white-space: nowrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Scanner d'Inventaire</h2>
    <div id="reader"></div>
    <div id="lock-timer"><div id="lock-bar"></div></div>
    <div id="last-scan">Prêt à scanner...</div>
    <div class="controls">
        <button class="btn-excel" onclick="exportToExcel()">📥 Télécharger Excel</button>
        <button class="btn-reset" onclick="resetData()">🔄 Réinitialiser</button>
    </div>
    <div class="stats">
        <table>
            <thead>
                <tr>
                    <th>Code</th>
                    <th style="text-align: center;">Qté</th>
                    <th style="text-align: right;">Actions</th>
                </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- VARIABLES GLOBALES ---
    let inventory = JSON.parse(localStorage.getItem('inventory')) || {};
    let isLocked = false;
    const LOCK_TIME = 1500; // 1.5 secondes de pause entre les scans

    // --- FONCTIONS DE GESTION DE L'INVENTAIRE ---

    function updateTable() {
        const body = document.getElementById('inventoryBody');
        body.innerHTML = '';
        const entries = Object.entries(inventory).reverse();
        
        for (const [code, count] of entries) {
            const row = `
                <tr>
                    <td>${code}</td>
                    <td style="text-align: center;"><span class="qty-badge">${count}</span></td>
                    <td class="actions-cell">
                        <button class="btn-edit" onclick="editQuantity('${code}')">Modifier</button>
                        <button class="btn-delete" onclick="deleteItem('${code}')">Supprimer</button>
                    </td>
                </tr>`;
            body.innerHTML += row;
        }
        localStorage.setItem('inventory', JSON.stringify(inventory));
    }

    function editQuantity(code) {
        const currentCount = inventory[code];
        const newCountStr = prompt(`Modifier la quantité pour le code :\n${code}\n\nQuantité actuelle : ${currentCount}`, currentCount);

        if (newCountStr !== null) {
            const newCount = parseInt(newCountStr, 10);
            if (!isNaN(newCount) && newCount >= 0) {
                if (newCount === 0) {
                    delete inventory[code];
                } else {
                    inventory[code] = newCount;
                }
                updateTable();
            } else {
                alert("Veuillez entrer un nombre valide.");
            }
        }
    }

    function deleteItem(code) {
        if (confirm(`Voulez-vous vraiment supprimer l'article avec le code :\n${code} ?`)) {
            delete inventory[code];
            updateTable();
        }
    }

    function resetData() {
        if (confirm("Vider tout l'inventaire ? Cette action est irréversible.")) {
            inventory = {};
            updateTable();
            document.getElementById('last-scan').innerText = "Inventaire vidé. Prêt...";
        }
    }

    function exportToExcel() {
        if (Object.keys(inventory).length === 0) {
            alert("Aucune donnée à exporter.");
            return;
        }
        const data = Object.entries(inventory).map(([code, count]) => ({ 
            "Code Barre": code, 
            "Quantité": count,
            "Date Export": new Date().toLocaleString('fr-FR')
        }));
        const worksheet = XLSX.utils.json_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Inventaire");
        XLSX.writeFile(workbook, "inventaire_" + Date.now() + ".xlsx");
    }

    // --- FONCTIONS DU SCANNER ---

    function onScanSuccess(decodedText, decodedResult) {
        if (isLocked) return;

        isLocked = true;
        document.getElementById('last-scan').innerText = "✅ " + decodedText;
        
        inventory[decodedText] = (inventory[decodedText] || 0) + 1;
        updateTable();

        const timerDiv = document.getElementById('lock-timer');
        const bar = document.getElementById('lock-bar');
        timerDiv.style.display = 'block';
        bar.style.width = '100%';
        
        let start = Date.now();
        let interval = setInterval(() => {
            let elapsed = Date.now() - start;
            let progress = 100 - (elapsed / LOCK_TIME * 100);
            bar.style.width = progress + '%';

            if (elapsed >= LOCK_TIME) {
                clearInterval(interval);
                isLocked = false;
                timerDiv.style.display = 'none';
                document.getElementById('last-scan').innerText = "Prêt...";
            }
        }, 50);
    }
    
    function onScanFailure(error) {
        // Laisser vide pour ne pas afficher d'erreurs en console
    }

// --- INITIALISATION DE L'APPLICATION ---

document.addEventListener('DOMContentLoaded', () => {
    const html5QrCode = new Html5Qrcode("reader");

    // Configuration du scanner
    const config = { 
        fps: 10, 
        qrbox: { width: 300, height: 150 } // Zone de détection plus large
    };

    // Configuration de la caméra pour demander une meilleure résolution
    const cameraConfig = { 
        facingMode: "environment",
        // Contraintes vidéo pour tenter d'obtenir un flux de meilleure qualité
        videoConstraints: {
            width: { ideal: 1920 },
            height: { ideal: 1080 }
        }
    };

    // Démarrage du scanner
    html5QrCode.start(
        cameraConfig, 
        config, 
        onScanSuccess, 
        onScanFailure
    ).catch(err => {
        // Gère les erreurs si la caméra ne peut pas être démarrée
        const lastScanElem = document.getElementById('last-scan');
        lastScanElem.style.color = 'var(--danger)'; // Change la couleur du message en rouge
        lastScanElem.innerText = "Erreur caméra. Vérifiez les autorisations et rafraîchissez.";
        console.error("Erreur de démarrage de la caméra : ", err);
    });

    // Met à jour la table au chargement de la page pour afficher les données sauvegardées
    updateTable();
});

</script>
</body>
</html>
